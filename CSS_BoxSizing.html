<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        #parent{
            position: relative;
            width: 800px;
            height: 500px;
            background-color: pink;
            border: 5px solid brown;
        }
        #d1{
            position: relative;
            width: 200px;
            height: 150px;
            background-color: aqua;
            border: 5px solid red;
            padding: 20px;
            box-sizing: border-box;
            /* box-shadow: 10px 10px 3px 5px blue; */
                       /* horizontal vertical blur spread color */
            left: 50px;
            top: 30px;
            z-index: 3;
            /* transition: 5s transform; */
            animation: move 5s infinite alternate;
        
        }
        @keyframes move {
            /* from{
                transform: translateX(0px);
            }
            to{
                 transform: translateX(150px);  translateX is used for horizontal movement
            }
            from{
                transform: translateY(0px);
            }
            to{
                transform: translateY(150px);   translateY is used for vertical movement
            } */
            from{
                transform: scale(0);
            }
            to{
                transform: scale(2);
            }

        }

        #d1:hover{
            /* transform: translate(150px); */
            /* transform: rotate(150deg); */
            /* transform: skew(50deg); */
            /* transform: scale(1.5); */
         
        }


        #d2{
            position: absolute;
            width: 200px;
            height: 150px;
            background-color: yellowgreen;
            border: 5px solid powderblue;
            padding: 20px;
            box-sizing: border-box;
            /* right: 50px; */
            /* bottom: 30px; */
            top: 100px;
            left: 100px;
            z-index: 2;


        }
    </style>
</head>
<body>
    <div id="parent">
    <div id="d1">this is div section</div>
    <!-- <div id="d2">this is second div</div> -->
</div>
</body>
</html>
